<html>
<head>
<style>

.wrapper { overflow-x: auto; margin-top: 100px; }
table { width: 1000px; border-collapse: collapse; }
th { position: sticky; top: 0; background: yellow; }
td, th { border: 1px solid black; padding: 10px; }
</style>
</head>
<body>
<div class="wrapper">
  <table>
    <thead><tr><th>Header</th><th>Header</th></tr></thead>
    <tbody>
      <tr><td>Row</td><td>Row</td></tr>
      <tr><td>Row</td><td>Row</td></tr>
      <tr><td>Row</td><td>Row</td></tr>
      <tr><td>Row</td><td>Row</td></tr>
      <tr><td>Row</td><td>Row</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
