<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Hubify Social - Platform manajemen media sosial cerdas untuk perencanaan, analisis, dan penjadwalan konten dengan bantuan AI." />
    <meta name="keywords" content="social media management, hubify social, manajemen konten, ai social media, penjadwalan konten, analisis media sosial" />
    <meta name="author" content="Hubify Social" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hubify Social - Social Media Management" />
    <meta property="og:description" content="Platform manajemen media sosial cerdas untuk perencanaan, analisis, dan penjadwalan konten dengan bantuan AI." />
    <meta property="og:url" content="https://hubifysocial.com/" />
    <meta property="og:site_name" content="Hubify Social" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hubify Social - Social Media Management" />
    <meta name="twitter:description" content="Platform manajemen media sosial cerdas untuk perencanaan, analisis, dan penjadwalan konten dengan bantuan AI." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Hubify Social</title>
    <script>
      window.addEventListener('error', (event) => {
        try {
          fetch('/api/log-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "HTML Uncaught Error", error: event.message, filename: event.filename, lineno: event.lineno })
          });
        } catch (e) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
